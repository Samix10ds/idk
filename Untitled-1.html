<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malwarelab150</title>
    <meta name="description" content="Sito ufficiale per la promozione del nostro canale YouTube. Scopri i nostri video, iscriviti e resta aggiornato!">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', Arial, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
        }
        header {
            background: #1e293b;
            padding: 40px 0 20px 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 2px;
        }
        header p {
            margin: 10px 0 0 0;
            font-size: 1.2rem;
            color: #94a3b8;
        }
        .cta {
            margin: 30px 0;
            text-align: center;
        }
        .cta a {
            background: #ef4444;
            color: #fff;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(239,68,68,0.15);
            transition: background 0.2s;
        }
        .cta a:hover {
            background: #dc2626;
        }
        .videos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 32px;
            padding: 40px 10vw;
        }
        .video-card {
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
            width: 340px;
            transition: transform 0.2s;
        }
        .video-card:hover {
            transform: translateY(-6px) scale(1.03);
        }
        .video-card iframe {
            width: 100%;
            height: 190px;
            border: none;
            display: block;
        }
        .video-card .desc {
            padding: 18px 20px;
        }
        .video-card h3 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            color: #fbbf24;
        }
        .video-card p {
            margin: 0;
            color: #cbd5e1;
            font-size: 0.98rem;
        }
        footer {
            background: #0f172a;
            color: #64748b;
            text-align: center;
            padding: 24px 0 12px 0;
            font-size: 0.95rem;
            margin-top: 40px;
        }
        @media (max-width: 900px) {
            .videos {
                flex-direction: column;
                align-items: center;
                padding: 30px 2vw;
            }
            .video-card {
                width: 98vw;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Malwarelab150</h1>
        <p>Testo e samnetto con windows e linux e creo virus!</p>
    </header>
    <section class="cta">
        <a href="https://www.youtube.com/Malwarelab150" target="_blank" rel="noopener">Iscriviti al Canale</a>
    </section>
    <section class="videos">
        <div class="video-card">
            <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/fj4AheIJyqo?si=ASpWk7xFz-wtLS_s" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <div class="desc">
                <h3>Cancello Program x86 (aiuto)</h3>
                <p>Guarda il mio video piu popolare!</p>
            </div>
        </div>
        </div>
    </section>
    <footer>
        &copy; 2025 Malwarelab150. Tutti i diritti riservati.
    </footer>
</body>
</html>
